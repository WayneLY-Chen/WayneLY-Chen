name: generate animation

on:
  # 每 2 小時自動跑一次
  schedule:
    - cron: "0 */2 * * *" 
  
  # 允許手動執行
  workflow_dispatch:
  
  # 當 main 分支有 push 時執行
  push:
    branches:
    - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
  
    steps:
      # 產生 RGB 配色的貪食蛇動畫
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7aa2f7&color_dots=#161b22,#7ee787,#79c0ff,#bb9af7,#f7768e
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#161b22,#7ee787,#79c0ff,#bb9af7,#f7768e
    
      # 將產出的檔案推送到 output 分支
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
